# Surveillance du stock PS5, 24 h/24, sur les serveurs gratuits de GitHub.
#
# Toutes les 30 minutes, GitHub lance une session qui vérifie les articles
# toutes les 5 minutes pendant ~29 minutes, puis la session suivante prend le
# relais. L'état (déjà en stock ou non) est conservé d'une session à l'autre.
#
# À configurer une seule fois : le secret NTFY_SUJET
# (Settings > Secrets and variables > Actions > New repository secret).

name: Surveillance stock PS5

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}   # bouton « Run workflow » pour lancer à la main

concurrency:
  group: surveillance-ps5
  cancel-in-progress: false

jobs:
  surveiller:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Récupérer l'état précédent
        uses: actions/cache/restore@v4
        with:
          path: etat_stock.json
          key: etat-${{ github.run_id }}
          restore-keys: etat-

      - name: Surveiller (toutes les 5 min, ~29 min)
        env:
          NTFY_SUJET: ${{ secrets.NTFY_SUJET }}
          # Lancement manuel (« Run workflow ») : notification « Surveillance démarrée ».
          DEMARRAGE: ${{ github.event_name == 'workflow_dispatch' && '--notif-demarrage' || '' }}
        # « Tout va bien » envoyé chaque jour à 8 h et 20 h (heure de Paris).
        run: python surveiller_ps5.py --duree 29 --intervalle 300 --sans-bureau --battement 8,20 $DEMARRAGE

      - name: Sauvegarder l'état
        if: always()
        uses: actions/cache/save@v4
        with:
          path: etat_stock.json
          key: etat-${{ github.run_id }}
